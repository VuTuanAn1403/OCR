[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pdf"
dynamic = ["version"]
description = "Vietnamese full-page GPU OCR with Docling structures, per-document keyword Excel and a durable batch matrix"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Base: what ocr_contracts, ocr_artifacts and ocr_keywords need (D1). Every
# other function is an extra; requirements/ holds one lock per runtime.
dependencies = ["pydantic>=2.0.0,<=2.14.0"]

[project.optional-dependencies]
reporting = ["openpyxl>=3.1.0,<4.0.0"]
# CPU app runtime: V6.3 CLI and batch supervisor, document owner, analysis
# runs, keyword Excel. Lock: requirements/v63/{windows,linux}-cpu-app.lock.
app = [
    "pymupdf>=1.24.0,<=1.28.2",
    "PyYAML>=6.0,<=6.0.3",
    "psutil>=5.9.0,<=7.2.2",
    "openpyxl>=3.1.0,<4.0.0",
]
# In-process OCR stack (Torch, VietOCR, OpenCV) shared by the legacy, gpu and
# cpu-benchmark extras; same pins as requirements.txt. The V6.3 GPU workers
# use their own locks in requirements/v62 instead.
inprocess = [
    "ocr-pdf[app]",
    "opencv-python-headless>=4.8.0,<=5.0.0.93",
    "pillow>=10.0.0,<=11.2.0",
    "numpy>=1.26.0,<=2.4.6",
    "torch>=2.1.0,<=2.14.0",
    "torchvision>=0.16.0,<=0.29.0",
    "vietocr==0.3.13",
    "tabulate>=0.9.0,<=0.10.0",
    "tqdm>=4.65.0,<=4.70.0",
    "requests>=2.28.0,<=2.34.2",
    # VietOCR imports pkg_resources at runtime; match requirements.txt.
    "setuptools>=65.5.1,<70.0.0",
]
gpu = ["ocr-pdf[inprocess]", "onnxruntime-gpu==1.23.2"]
cpu-benchmark = ["ocr-pdf[inprocess]", "onnxruntime>=1.18.0,<=1.29.0"]
# Existing 6.1 profiles and model checks (requirements-legacy.txt). Never
# combine with the gpu extra.
legacy = ["ocr-pdf[inprocess]", "rapidocr-onnxruntime>=1.3.0,<=1.4.4", "onnxruntime>=1.18.0,<=1.29.0"]
test = ["pytest>=8.0.0,<=9.1.1", "import-linter==2.5.2", "apted>=1.0.3", "scipy>=1.10,<2.0", "beautifulsoup4>=4.12,<5.0", "pycocotools>=2.0.7,<3"]
research = ["apted>=1.0.3", "scipy>=1.10,<2.0", "beautifulsoup4>=4.12,<5.0", "pycocotools>=2.0.7,<3"]
dev = ["import-linter==2.5.2"]

# Install editable (`pip install -e ".[app]"`) for the unified supervisor.
# GPU workers load this checkout using their own locks. A wheel supports
# keywords, reporting and verified analysis runs; extraction needs a checkout.
[project.scripts]
ocrpdf = "src.ocr.cli.unified:run_one"
ocrpdf-batch = "src.ocr.cli.unified:run_batch"
ocrpdf-perf = "benchmark.perf.run_perf:main"
ocrpdf-collect = "src.ocr.cli.collect:main"
ocrpdf-gpu = "src.ocr.cli.unified:run_one"

[tool.setuptools]
# `ocr_*` install top-level from src/; `src.ocr` (legacy, transitional) keeps
# its name. Package list and resources: setup.py. No package data: the only
# non-Python files are the resources setup.py bundles (the egg-info written
# into src/ must not ship inside `src`).
package-dir = { "" = "src", "src" = "src", "benchmark" = "benchmark" }
include-package-data = false

[tool.setuptools.dynamic]
# Read statically from the file (setuptools AST), never imported under this name.
version = { attr = "ocr_document.manifest_exporter.PIPELINE_VERSION" }

# Module boundaries (config/module_map.json). Run: lint-imports (from the repository root).
# Each internal package absent from the table's allowed-dependency column is
# forbidden, including packages introduced after the original contract. Keep
# the controlled violation tests in tests/unit/test_import_contracts.py in sync.
[tool.importlinter]
root_packages = ["src", "ocr_contracts", "ocr_artifacts", "ocr_keywords", "ocr_reporting", "ocr_runtime", "ocr_text",
                 "ocr_pdf_io", "ocr_recognition", "ocr_layout",
                 "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "contracts"
name = "ocr_contracts imports only pydantic and the standard library"
type = "forbidden"
source_modules = ["ocr_contracts"]
forbidden_modules = ["src", "ocr_artifacts", "ocr_keywords", "ocr_reporting", "ocr_runtime", "ocr_text", "ocr_pdf_io",
                     "ocr_recognition", "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "numpy", "pymupdf", "cv2", "PIL", "torch", "onnxruntime",
                     "vietocr", "docling", "transformers", "openpyxl", "yaml", "psutil"]

[[tool.importlinter.contracts]]
id = "artifacts"
name = "ocr_artifacts imports only ocr_contracts and the standard library"
type = "forbidden"
source_modules = ["ocr_artifacts"]
forbidden_modules = ["src", "ocr_keywords", "ocr_reporting", "ocr_runtime", "ocr_text", "ocr_pdf_io", "ocr_recognition",
                     "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "numpy", "pymupdf", "cv2", "PIL", "torch", "onnxruntime", "vietocr",
                     "docling", "transformers", "openpyxl", "yaml", "psutil"]

[[tool.importlinter.contracts]]
id = "keywords"
name = "ocr_keywords is CPU-only: contracts, artifacts and the standard library"
type = "forbidden"
source_modules = ["ocr_keywords"]
# literal_v1 defines its own NFC + casefold; ocr_text normalization would change counts.
forbidden_modules = ["src", "ocr_reporting", "ocr_runtime", "ocr_text", "ocr_pdf_io", "ocr_recognition",
                     "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "openpyxl", "numpy", "pymupdf", "cv2", "PIL", "torch", "onnxruntime", "vietocr",
                     "docling", "transformers", "yaml", "psutil"]

[[tool.importlinter.contracts]]
id = "reporting"
name = "ocr_reporting uses keyword data and openpyxl only, never OCR or the ledger"
type = "forbidden"
source_modules = ["ocr_reporting"]
forbidden_modules = ["src", "ocr_runtime", "ocr_text", "ocr_pdf_io", "ocr_recognition", "ocr_layout",
                     "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "numpy", "pymupdf", "cv2", "PIL", "torch", "onnxruntime", "vietocr", "docling",
                     "transformers", "yaml", "psutil"]

# Code running inside the extraction phases never reaches keyword, reporting or
# publication code, so changing those cannot change extraction (P11a closure).
# The phase A page engine (src.ocr.application.process_page) is checked too.
[[tool.importlinter.contracts]]
id = "extraction"
name = "Extraction phases do not import keywords, reporting or publication"
type = "forbidden"
source_modules = ["ocr_workers"]
forbidden_modules = ["ocr_keywords", "ocr_reporting", "ocr_pipeline", "src.ocr.application.count_keywords",
                     "src.ocr.application.export_document"]

[[tool.importlinter.contracts]]
id = "runtime"
name = "ocr_runtime depends on contracts/artifacts, PyYAML and psutil only"
type = "forbidden"
source_modules = ["ocr_runtime"]
forbidden_modules = ["src", "ocr_keywords", "ocr_reporting", "ocr_text", "ocr_pdf_io", "ocr_recognition",
                     "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "numpy", "pymupdf", "cv2", "PIL",
                     "vietocr", "docling", "transformers", "openpyxl"]

[[tool.importlinter.contracts]]
id = "text"
name = "ocr_text is standard library only"
type = "forbidden"
source_modules = ["ocr_text"]
forbidden_modules = ["src", "ocr_contracts", "ocr_artifacts", "ocr_runtime", "ocr_keywords", "ocr_reporting",
                     "ocr_pdf_io", "ocr_recognition", "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "pydantic", "numpy", "pymupdf", "cv2", "PIL", "torch", "onnxruntime", "vietocr",
                     "docling", "transformers", "openpyxl", "yaml", "psutil"]

[[tool.importlinter.contracts]]
id = "pdf_io"
name = "ocr_pdf_io reads and renders PDFs without OCR models, keywords or reporting"
type = "forbidden"
source_modules = ["ocr_pdf_io"]
forbidden_modules = ["src", "ocr_keywords", "ocr_reporting", "ocr_recognition", "ocr_layout", "ocr_structure",
                     "ocr_document", "ocr_pipeline", "ocr_workers", "torch", "onnxruntime", "vietocr", "docling",
                     "transformers", "openpyxl"]

[[tool.importlinter.contracts]]
id = "recognition"
name = "ocr_recognition: detection/recognition/quality without layout, structure, keywords or reporting"
type = "forbidden"
source_modules = ["ocr_recognition"]
forbidden_modules = ["src", "ocr_layout", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "ocr_keywords", "ocr_reporting", "docling", "openpyxl"]

[[tool.importlinter.contracts]]
id = "layout"
name = "ocr_layout: page layout models without recognition, structure, keywords or reporting"
type = "forbidden"
source_modules = ["ocr_layout"]
forbidden_modules = ["src", "ocr_recognition", "ocr_structure", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "ocr_keywords", "ocr_reporting", "docling", "openpyxl",
                     "vietocr"]

[[tool.importlinter.contracts]]
id = "structure"
name = "ocr_structure: tables/formulas and the Docling client, without recognition, layout models or Docling"
type = "forbidden"
source_modules = ["ocr_structure"]
forbidden_modules = ["src", "ocr_recognition", "ocr_layout", "ocr_document", "ocr_pipeline", "ocr_workers",
                     "ocr_keywords", "ocr_reporting", "docling", "vietocr",
                     "torch", "onnxruntime", "transformers", "openpyxl"]

[[tool.importlinter.contracts]]
id = "document"
name = "ocr_document assembles and exports documents without recognition, layout models, structure, keywords or reporting"
type = "forbidden"
source_modules = ["ocr_document"]
forbidden_modules = ["src", "ocr_recognition", "ocr_layout", "ocr_structure", "ocr_pipeline", "ocr_workers",
                     "ocr_keywords", "ocr_reporting", "docling",
                     "vietocr", "torch", "onnxruntime", "transformers", "openpyxl"]

[[tool.importlinter.contracts]]
id = "workers"
name = "ocr_workers run one GPU phase: no keywords, reporting, ledger or pipeline"
type = "forbidden"
source_modules = ["ocr_workers"]
forbidden_modules = ["src", "ocr_keywords", "ocr_reporting", "ocr_pipeline", "openpyxl"]

[[tool.importlinter.contracts]]
id = "pipeline"
name = "ocr_pipeline runs on the CPU runtime and starts workers only as subprocesses"
type = "forbidden"
source_modules = ["ocr_pipeline"]
forbidden_modules = ["src", "ocr_workers", "torch", "vietocr", "onnxruntime", "docling", "transformers"]

# `benchmark` (GT evaluators, ocrpdf-perf) is not in the dependency table.
# Its one user is ocr_document.validation: a lazy import, taken only when a GT
# manifest is passed, moved unchanged from the legacy validator (MIGRATION_PLAN,
# "Danh sách alias và ngoại lệ"). Layers below the document never reach it;
# pipeline and workers reach it only through that validator.
[[tool.importlinter.contracts]]
id = "benchmark"
name = "Packages below ocr_document never reach the benchmark evaluators"
type = "forbidden"
source_modules = ["ocr_contracts", "ocr_artifacts", "ocr_keywords", "ocr_reporting", "ocr_runtime", "ocr_text",
                  "ocr_pdf_io", "ocr_recognition", "ocr_layout", "ocr_structure"]
forbidden_modules = ["benchmark"]

[[tool.importlinter.contracts]]
id = "benchmark-direct"
name = "ocr_pipeline and ocr_workers do not import the benchmark evaluators themselves"
type = "forbidden"
source_modules = ["ocr_pipeline", "ocr_workers"]
forbidden_modules = ["benchmark"]
allow_indirect_imports = true
